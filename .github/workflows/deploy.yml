name: Deploy a GitHub Pages

# Solo manual: no se publica nada al hacer push. Se ejecuta desde Actions > Deploy > Run workflow,
# una vez que el script de Google (Apps Script) exista y se haya probado con un envio real.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Variable del repositorio (Settings > Secrets and variables > Actions > Variables).
      # Es publica: queda dentro del JS del sitio. Debe ser la URL /exec de la aplicacion web de Google Apps Script (ver integraciones/formulario/README.md).
      PUBLIC_WEBHOOK_URL: ${{ vars.PUBLIC_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Falla si falta el webhook
        run: test -n "$PUBLIC_WEBHOOK_URL" || { echo "Falta la variable PUBLIC_WEBHOOK_URL"; exit 1; }
      - uses: withastro/action@v6
        with:
          node-version: 22 # Astro 7 exige Node >= 22.12 (con 20 el build falla)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
